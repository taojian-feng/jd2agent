[project]
name = "customization-planner"
version = "0.1.0"
description = "JD2Agent: decides whether an agent's failures call for model customization, and builds checked SFT and preference data from its traces"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20",
    "pydantic>=2.7",
    "pyyaml>=6",
    "agent-evaluator",
    "prior-auth-reviewer",
]

[project.optional-dependencies]
aws = ["langchain-aws"]
azure = ["langchain-openai"]
gcp = ["langchain-google-vertexai"]
anthropic = ["langchain-anthropic"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
customization-planner = "customization_planner.server:main"

[tool.uv.sources]
agent-evaluator = { path = "../agent-evaluator", editable = true }
prior-auth-reviewer = { path = "../prior-auth-reviewer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["customization_planner"]
