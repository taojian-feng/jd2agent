[project]
name = "ai-architect-agent"
version = "0.1.0"
description = "JD2Agent: an MCP agent that designs and reviews agentic AI architectures"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20",
    "pydantic>=2.7",
    "pyyaml>=6",
    "langgraph>=0.6",
    "langchain>=0.3",
]

[project.optional-dependencies]
aws = ["langchain-aws"]
azure = ["langchain-openai"]
gcp = ["langchain-google-vertexai"]
anthropic = ["langchain-anthropic"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
ai-architect = "ai_architect.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_architect"]
